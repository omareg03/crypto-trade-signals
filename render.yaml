services:
  - type: web
    name: quantum-trader-signals
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REFRESH_INTERVAL
        value: 60
      - key: ACCOUNT_SIZE
        value: 5000

  - type: worker
    name: hyro-bridge-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python hyro_bridge.py --loop
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: SCAN_INTERVAL
        value: 600
      - key: RISK_PCT_EVAL
        value: 0.5
      - key: RISK_PCT_FUNDED
        value: 0.5
      - key: HYRO_AGENT_TOKEN
        sync: false
