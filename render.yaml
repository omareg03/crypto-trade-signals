services:
  - type: web
    name: quantum-trader-signals
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: REFRESH_INTERVAL
        value: 60
      - key: ACCOUNT_SIZE
        value: 5000
